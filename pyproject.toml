[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lista5"
version = "0.1.0"
description = "Quinta lista de ejercicios - Selección de variables y generalización"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "statsmodels",
    "matplotlib",
    "seaborn",
]

[tool.setuptools.packages.find]
where = ["src"]